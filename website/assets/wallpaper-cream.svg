<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- CoinCync Wallpaper — Ink on Cream -->
  <defs>
    <radialGradient id="warm" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#f5f0e6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#e8e0d0" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="spot" cx="40%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#faf7f0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="paper" width="300" height="300" patternUnits="userSpaceOnUse">
      <filter id="pnoise"><feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
      <rect width="300" height="300" filter="url(#pnoise)" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#warm)"/>
  <rect width="1920" height="1080" fill="url(#spot)"/>
  <rect width="1920" height="1080" fill="url(#paper)"/>

  <!-- Faint construction lines -->
  <line x1="960" y1="300" x2="960" y2="780" stroke="rgba(58,51,40,0.04)" stroke-width="0.5"/>
  <line x1="720" y1="540" x2="1200" y2="540" stroke="rgba(58,51,40,0.04)" stroke-width="0.5"/>
  <circle cx="960" cy="540" r="100" fill="none" stroke="rgba(58,51,40,0.025)" stroke-width="0.5" stroke-dasharray="4 6"/>

  <!-- Centered mark -->
  <g transform="translate(960,540)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#3a3328" stroke-width="16" opacity="0.85"/>
    <path d="M 157 0 A 157 157 0 1 0 0 157" fill="none" stroke="#f5f0e6" stroke-width="28"/>
    <line x1="152" y1="0" x2="196" y2="0" stroke="#f5f0e6" stroke-width="28"/>
    <circle cx="-75" cy="0" r="18" fill="#3a3328" opacity="0.85"/>
    <circle cx="75" cy="0" r="18" fill="#3a3328" opacity="0.85"/>
  </g>

  <!-- Corner accents -->
  <line x1="60" y1="60" x2="140" y2="60" stroke="rgba(58,51,40,0.06)" stroke-width="0.5"/>
  <line x1="60" y1="60" x2="60" y2="140" stroke="rgba(58,51,40,0.06)" stroke-width="0.5"/>
  <line x1="1860" y1="1020" x2="1780" y2="1020" stroke="rgba(58,51,40,0.06)" stroke-width="0.5"/>
  <line x1="1860" y1="1020" x2="1860" y2="940" stroke="rgba(58,51,40,0.06)" stroke-width="0.5"/>
</svg>
