<?xml version="1.0" encoding="UTF-8"?>
<!--
  CoinCync Wallpaper: "The Veil" — Portrait
  1170×2532. Three concentric-arc centers, repositioned for portrait.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1170 2532"
     width="1170" height="2532"
     preserveAspectRatio="xMidYMid slice"
     style="display:block">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="17"/>
      <feColorMatrix values="0 0 0 0 0.83  0 0 0 0 0.63  0 0 0 0 0.35  0 0 0 0.02 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1170" height="2532" fill="#0a0a09"/>

  <g transform="translate(300 600)" fill="none" stroke-linecap="round">
    <circle r="650" stroke="#1a1612" stroke-width="0.5"/>
    <circle r="550" stroke="#2a2720" stroke-width="0.5" stroke-dasharray="1 8"/>
    <circle r="450" stroke="#2a2720" stroke-width="0.5"/>
    <circle r="370" stroke="#3a3328" stroke-width="0.5"/>
    <circle r="295" stroke="#3a3328" stroke-width="0.5" stroke-dasharray="2 6"/>
    <circle r="230" stroke="#5a5448" stroke-width="0.5"/>
    <circle r="175" stroke="#8a6838" stroke-width="0.5" opacity="0.55"/>
    <circle r="130" stroke="#d4a059" stroke-width="0.55" opacity="0.4"/>
    <circle r="92"  stroke="#d4a059" stroke-width="0.7"  opacity="0.55"/>
    <circle r="62"  stroke="#d4a059" stroke-width="0.85" opacity="0.7"/>
    <circle r="38"  stroke="#d4a059" stroke-width="1"/>
  </g>

  <g transform="translate(870 1700)" fill="none" stroke-linecap="round">
    <circle r="800" stroke="#1a1612" stroke-width="0.5"/>
    <circle r="680" stroke="#2a2720" stroke-width="0.5" stroke-dasharray="1 10"/>
    <circle r="565" stroke="#2a2720" stroke-width="0.5"/>
    <circle r="465" stroke="#3a3328" stroke-width="0.5"/>
    <circle r="375" stroke="#3a3328" stroke-width="0.5" stroke-dasharray="2 8"/>
    <circle r="300" stroke="#5a5448" stroke-width="0.5"/>
    <circle r="235" stroke="#8a6838" stroke-width="0.55" opacity="0.55"/>
    <circle r="180" stroke="#d4a059" stroke-width="0.55" opacity="0.4"/>
    <circle r="132" stroke="#d4a059" stroke-width="0.7"  opacity="0.55"/>
    <circle r="92"  stroke="#d4a059" stroke-width="0.85" opacity="0.7"/>
    <circle r="58"  stroke="#d4a059" stroke-width="1"/>
    <circle r="30"  stroke="#d4a059" stroke-width="1"/>
    <circle r="15"  stroke="#f5f0e6" stroke-width="0.8"/>
  </g>

  <rect width="1170" height="2532" fill="#0a0a09" filter="url(#grain)" opacity="0.4" pointer-events="none"/>
</svg>
