<?xml version="1.0" encoding="UTF-8"?>
<!--
  CoinCync Wallpaper: "The Formula" — Portrait
  1170×2532. Formula sits in the lower two-thirds.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1170 2532"
     width="1170" height="2532"
     preserveAspectRatio="xMidYMid slice"
     style="display:block">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="23"/>
      <feColorMatrix values="0 0 0 0 0.83  0 0 0 0 0.63  0 0 0 0 0.35  0 0 0 0.025 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1170" height="2532" fill="#0a0a09"/>

  <g stroke="#3a3328" stroke-width="0.7" fill="none">
    <line x1="120" y1="1500" x2="1050" y2="1500"/>
    <line x1="120" y1="1900" x2="1050" y2="1900"/>
  </g>
  <g stroke="#5a5448" stroke-width="0.7" fill="none">
    <line x1="120" y1="1500" x2="140" y2="1500"/>
    <line x1="1030" y1="1500" x2="1050" y2="1500"/>
    <line x1="120" y1="1900" x2="140" y2="1900"/>
    <line x1="1030" y1="1900" x2="1050" y2="1900"/>
  </g>

  <text x="585" y="1780"
        font-family="'Fraunces', 'Playfair Display', ui-serif, Georgia, serif"
        font-style="italic" font-weight="400"
        font-size="220" letter-spacing="-2"
        text-anchor="middle"
        fill="#f5f0e6">
    C = <tspan fill="#d4a059">r</tspan>G + <tspan fill="#d4a059">v</tspan>H
  </text>

  <text x="585" y="1960"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="20" letter-spacing="4"
        text-anchor="middle"
        fill="#5a5448">
    THE PEDERSEN COMMITMENT
  </text>

  <g stroke="#2a2720" fill="none" opacity="0.6">
    <line x1="120" y1="320" x2="230" y2="320"/>
    <line x1="940" y1="320" x2="1050" y2="320"/>
  </g>

  <text x="120" y="298"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="17" letter-spacing="3"
        fill="#5a5448">
    FIG. I
  </text>

  <text x="1050" y="298" text-anchor="end"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="17" letter-spacing="3"
        fill="#5a5448">
    CYNC LAB
  </text>

  <text x="585" y="2200" text-anchor="middle"
        font-family="'Fraunces', ui-serif, Georgia, serif"
        font-style="italic"
        font-size="26" letter-spacing="0.5"
        fill="#8a6838">
    Don't trust. Verify.
  </text>

  <rect width="1170" height="2532" fill="#0a0a09" filter="url(#grain)" opacity="0.3" pointer-events="none"/>
</svg>
