  <circle cx="585" cy="1266" r="340" fill="url(#proof-halo)"/>

  <line x1="410" y1="1266" x2="760" y2="1266"
        stroke="#d4a059" stroke-width="1.3" stroke-linecap="round"/>

  <circle cx="585" cy="1266" r="5" fill="#f5f0e6"/>
  <circle cx="585" cy="1266" r="10" fill="none" stroke="#f5f0e6" stroke-width="0.85"/>

  <g stroke="#d4a059" fill="none" stroke-linecap="round">
    <line x1="585" y1="1245" x2="585" y2="1287" stroke-width="0.6" opacity="0.6"/>
  </g>

  <rect width="1170" height="2532" fill="#0a0a09" filter="url(#grain)" opacity="0.35" pointer-events="none"/>
