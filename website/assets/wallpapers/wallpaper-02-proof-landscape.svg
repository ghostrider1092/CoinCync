  <circle cx="1920" cy="1080" r="420" fill="url(#proof-halo)"/>

  <line x1="1700" y1="1080" x2="2140" y2="1080"
        stroke="#d4a059" stroke-width="1.3" stroke-linecap="round"/>

  <circle cx="1920" cy="1080" r="5"  fill="#f5f0e6"/>
  <circle cx="1920" cy="1080" r="10" fill="none" stroke="#f5f0e6" stroke-width="0.85"/>

  <g stroke="#d4a059" fill="none" stroke-linecap="round">
