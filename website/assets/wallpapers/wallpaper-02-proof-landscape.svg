<?xml version="1.0" encoding="UTF-8"?>
<!--
  CoinCync Wallpaper: "The Proof" — Landscape
  3840×2160.

  A grid of short horizontal rules at Fibonacci-derived positions
  across the canvas. Reads like a page of mathematical proof.
  Most rules are faint ink; one is brass. A single commitment point
  at the brass rule's centerline marks where the math resolves.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 3840 2160"
     width="3840" height="2160"
     preserveAspectRatio="xMidYMid slice"
     style="display:block">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5"/>
      <feColorMatrix values="0 0 0 0 0.83  0 0 0 0 0.63  0 0 0 0 0.35  0 0 0 0.03 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
    <radialGradient id="proof-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d4a059" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d4a059" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="3840" height="2160" fill="#0a0a09"/>

  <g stroke="#3a3328" stroke-width="1" stroke-linecap="round">
    <line x1="320"  y1="240"  x2="480"  y2="240"/>
    <line x1="580"  y1="340"  x2="700"  y2="340"/>
    <line x1="840"  y1="290"  x2="990"  y2="290"/>
