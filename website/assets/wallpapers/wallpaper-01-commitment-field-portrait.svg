<?xml version="1.0" encoding="UTF-8"?>
<!--
  CoinCync Wallpaper: "The Commitment Field" — Portrait
  1170×2532, scales cleanly to most phones in portrait orientation.
  Recomposed for portrait, not merely cropped.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1170 2532"
     width="1170" height="2532"
     preserveAspectRatio="xMidYMid slice"
     style="display:block">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.83  0 0 0 0 0.63  0 0 0 0 0.35  0 0 0 0.025 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>

    <radialGradient id="center-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#d4a059" stop-opacity="0.18"/>
      <stop offset="40%"  stop-color="#d4a059" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#d4a059" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1170" height="2532" fill="#0a0a09"/>

  <g transform="translate(585 1266)" fill="none" stroke-linecap="round">
    <circle r="1200" stroke="#1a1612" stroke-width="0.75"/>
    <circle r="1050" stroke="#1a1612" stroke-width="0.5" stroke-dasharray="2 12"/>
    <circle r="900"  stroke="#2a2720" stroke-width="0.75"/>
    <circle r="780"  stroke="#2a2720" stroke-width="0.5" stroke-dasharray="4 10"/>
    <circle r="670"  stroke="#2a2720" stroke-width="0.75"/>
    <circle r="575"  stroke="#2a2720" stroke-width="0.5"/>
    <circle r="490"  stroke="#3a3328" stroke-width="0.6" stroke-dasharray="1 8"/>
    <circle r="410"  stroke="#3a3328" stroke-width="0.75"/>
    <circle r="340"  stroke="#3a3328" stroke-width="0.6"/>
    <circle r="280"  stroke="#5a5448" stroke-width="0.5" stroke-dasharray="2 6" opacity="0.7"/>
    <circle r="225"  stroke="#5a5448" stroke-width="0.75" opacity="0.8"/>
    <circle r="178"  stroke="#8a6838" stroke-width="0.6" opacity="0.7"/>
    <circle r="138"  stroke="#8a6838" stroke-width="0.75" opacity="0.85"/>
    <circle r="105"  stroke="#d4a059" stroke-width="0.6" opacity="0.45"/>
    <circle r="78"   stroke="#d4a059" stroke-width="0.85" opacity="0.6"/>
    <circle r="56"   stroke="#d4a059" stroke-width="1"   opacity="0.8"/>
    <circle r="37"   stroke="#d4a059" stroke-width="1.1"/>
    <circle r="22"   stroke="#f5f0e6" stroke-width="0.9"/>
  </g>

  <circle cx="585" cy="1266" r="200" fill="url(#center-halo)"/>

  <g stroke="#d4a059" fill="none" stroke-linecap="round">
    <line x1="585" y1="1236" x2="585" y2="1296" stroke-width="0.85"/>
    <line x1="555" y1="1266" x2="615" y2="1266" stroke-width="0.85"/>
  </g>

  <circle cx="585" cy="1266" r="5" fill="#f5f0e6"/>
  <circle cx="585" cy="1266" r="11" fill="none" stroke="#f5f0e6" stroke-width="0.85"/>

  <rect width="1170" height="2532" fill="#0a0a09" filter="url(#grain)" opacity="0.35" pointer-events="none"/>
</svg>
