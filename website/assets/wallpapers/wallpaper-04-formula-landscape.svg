<?xml version="1.0" encoding="UTF-8"?>
<!--
  CoinCync Wallpaper: "The Formula" — Landscape
  3840×2160.

  The Pedersen commitment formula set at massive scale, anchored to the
  lower field of the composition. Reads like a plate from a 19th-century
  mathematical treatise. The page is quiet above; the formula sits below.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 3840 2160"
     width="3840" height="2160"
     preserveAspectRatio="xMidYMid slice"
     style="display:block">

  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="23"/>
      <feColorMatrix values="0 0 0 0 0.83  0 0 0 0 0.63  0 0 0 0 0.35  0 0 0 0.025 0"/>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="3840" height="2160" fill="#0a0a09"/>

  <g stroke="#3a3328" stroke-width="0.7" fill="none">
    <line x1="320" y1="1440" x2="3520" y2="1440"/>
    <line x1="320" y1="1820" x2="3520" y2="1820"/>
  </g>
  <g stroke="#5a5448" stroke-width="0.7" fill="none">
    <line x1="320" y1="1440" x2="340" y2="1440"/>
    <line x1="3500" y1="1440" x2="3520" y2="1440"/>
    <line x1="320" y1="1820" x2="340" y2="1820"/>
    <line x1="3500" y1="1820" x2="3520" y2="1820"/>
  </g>

  <text x="1920" y="1700"
        font-family="'Fraunces', 'Playfair Display', ui-serif, Georgia, serif"
        font-style="italic" font-weight="400"
        font-size="400" letter-spacing="-4"
        text-anchor="middle"
        fill="#f5f0e6">
    C = <tspan fill="#d4a059">r</tspan>G + <tspan fill="#d4a059">v</tspan>H
  </text>

  <text x="1920" y="1870"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="28" letter-spacing="6"
        text-anchor="middle"
        fill="#5a5448">
    THE PEDERSEN COMMITMENT
  </text>

  <g stroke="#2a2720" fill="none" opacity="0.6">
    <line x1="320" y1="300" x2="500" y2="300"/>
    <line x1="3340" y1="300" x2="3520" y2="300"/>
  </g>

  <text x="320" y="280"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="22" letter-spacing="4"
        fill="#5a5448">
    FIG. I
  </text>

  <text x="3520" y="280" text-anchor="end"
        font-family="'JetBrains Mono', ui-monospace, monospace"
        font-size="22" letter-spacing="4"
        fill="#5a5448">
    CYNC LAB
  </text>

  <text x="1920" y="2050" text-anchor="middle"
        font-family="'Fraunces', ui-serif, Georgia, serif"
        font-style="italic"
        font-size="32" letter-spacing="0.5"
        fill="#8a6838">
    Don't trust. Verify.
  </text>

  <rect width="3840" height="2160" fill="#0a0a09" filter="url(#grain)" opacity="0.3" pointer-events="none"/>
</svg>
