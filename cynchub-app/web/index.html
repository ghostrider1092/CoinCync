<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CyncHub</title>
<link rel="stylesheet" href="app.css" />
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="logo">C</div><div class="name">Cync<b>Hub</b></div></div>
    <div class="navgroup">
      <div class="glabel">Suite</div>
      <button class="nav" data-screen="lens"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Lens</span></button>
      <button class="nav" data-screen="vault"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg><span>Vault</span></button>
      <button class="nav" data-screen="attest"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg><span>Attest</span></button>
      <button class="nav" data-screen="swap"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg><span>Swap</span><span class="chip">post-audit</span></button>
    </div>
    <div class="navgroup">
      <div class="glabel">Network</div>
      <button class="nav" data-screen="mining"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 17l5-5 4 3 6-7"/><path d="M3 21h18"/></svg><span>Mining</span></button>
      <button class="nav" data-screen="nodes"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="6" r="2.5"/><circle cx="5" cy="18" r="2.5"/><circle cx="19" cy="18" r="2.5"/><path d="M12 8.5v4m0 0l-5 3m5-3l5 3"/></svg><span>Nodes</span></button>
      <button class="nav" data-screen="diagnostics"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 4h16v12H4z"/><path d="M8 20h8M12 16v4"/></svg><span>Diagnostics</span></button>
    </div>
    <div class="navgroup">
      <div class="glabel">System</div>
      <button class="nav" data-screen="settings"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.2A1.7 1.7 0 0 0 7 19.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 5 13H4.9a2 2 0 1 1 0-4H5a1.7 1.7 0 0 0 1.1-2.9L6 6a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 11 4.6V4a2 2 0 1 1 4 0v.2A1.7 1.7 0 0 0 17 5.6l.1-.1A2 2 0 1 1 20 8.3l-.1.1A1.7 1.7 0 0 0 19.4 11H20a2 2 0 1 1 0 4z"/></svg><span>Settings</span></button>
    </div>
    <div class="foot">
      <div class="statusline"><span class="dot"></span> Testnet · non-custodial</div>
      <div class="statusline"><span class="dot"></span> Keys on device</div>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>
<script src="app.js" defer></script>
</body>
</html>
