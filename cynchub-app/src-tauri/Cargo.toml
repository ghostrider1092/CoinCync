[workspace]

[package]
name = "cynchub"
version = "0.1.0"
edition = "2021"
description = "CyncHub — the CoinCync privacy suite (desktop)."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri      = { version = "2", features = [] }
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest    = { version = "0.12", features = ["json", "blocking"] }
dirs-next  = "2.0"
zeroize    = "1"
rand       = "0.8"
qrcode     = "0.14"
tracing    = "0.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
