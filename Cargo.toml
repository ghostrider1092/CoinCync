[workspace]
members  = [".", "crates/auxpow", "crates/bridge", "crates/coincync-rig", "crates/coincync-swap", "crates/coincync-frost-coordinator", "crates/coincync-rolling-finality", "crates/orchard-side", "crates/tick"]
# crates/cynchub: CIP-002 skeleton (post-mainnet merge-mined liquidity layer).
# Doesn't define the workspace's "randomx"/"testnet" features, so workspace-
# wide builds with --features error on its Cargo.toml. Build standalone:
# `cd crates/cynchub && cargo build`. Re-joins workspace when CIP-002
# implementation starts (post v1.1).
exclude  = ["coincync-wallet-v2/src-tauri", "crates/cynchub"]
resolver = "2"

[package]
name         = "coincync"
version = "2.0.0"
edition      = "2021"
rust-version = "1.75"
authors      = ["CoinCync 1.0 Contributors"]
description  = "CoinCync â€” a compliant privacy cryptocurrency with CPU-only proof of work"
license      = "MIT"

[lib]
name = "coincync"
path = "src/lib.rs"

[[bin]]
name = "coincync-node"
path = "src/bin/node.rs"

[[bin]]
name = "coincync-wallet"
path = "src/bin/wallet.rs"

[[bin]]
# Utility for refreshing `critical_files.lock` after an intentional change
# to a consensus-critical file. See src/bin/update_critical_hashes.rs.
name = "update-critical-hashes"
path = "src/bin/update_critical_hashes.rs"

[[bin]]
# Small operator CLI used by scripts/publish-peer-snapshot.sh to sign
# peer-snapshot JSON with a raw Ed25519 seed. Output is the exact
# 64-byte signature the consumer (src/network/peer_snapshot.rs)
# expects to see on IPFS — no PEM envelope, no SSH wire format.
# See the file header for the design rationale.
name = "coincync-sign-snapshot"
path = "src/bin/sign_snapshot.rs"

[[bin]]
# Read-only health-monitoring sidecar (HealthTick). Runs as its own
# process so a bug here can't wedge the node; watches a local node over
# RPC + this host's /proc. See src/bin/coincync-tick.rs.
name = "coincync-tick"
path = "src/bin/coincync-tick.rs"

[features]
default = ["randomx"]
testnet = ["randomx"]
mainnet = ["randomx"]
randomx = ["randomx-rs"]
metrics = []
# Rolling soft-finality (CIP-009.D) consensus-layer adapter. Off by
# default: compiles in `src/consensus/rolling_finality.rs` and pulls
# the `coincync-rolling-finality` crate only when explicitly enabled.
# This gate exists so the CIP-011 phase-3 integration can be built,
# reviewed, and tested ahead of the activation decision without
# touching the consensus-locked files (`src/constants.rs`,
# `src/consensus/validation.rs`).
rolling-finality = ["dep:coincync-rolling-finality"]
# Test/diagnostic knobs. Opt-in, off by default.
test-vdf        = []
test-utilities  = []
# INSECURE — dev/testnet bootstrap only. Enables the checkpoint crypto skip
# in `src/consensus/validation.rs::allow_checkpoint_crypto_skip`. Previously
# controlled by a runtime env var; converted to compile-time feature so a
# production build physically cannot enable the skip. CI must reject any
# release artifact built with this feature. Prior art: zebrad's fast-sync
# feature gate. See feedback_snapshot_procedure.md / H2 in the 2026-06-30
# audit for rationale.
insecure-fast-sync = []
# Sketch features â€” implementations reserved for post-mainnet CIPs.
# All gated modules are off by default and not part of the production
# audit perimeter. See docs/cip/.
sketch-cut-through        = []   # CIP-003 (also see existing src/crypto/mw_cutthrough.rs)
sketch-block-aggregation  = []   # CIP-003 (pairs with cut-through)
sketch-kernel-offsets     = []   # CIP-004
sketch-lelantus-spark     = []   # CIP-005 (gates src/crypto/lelantus_spark.rs)

