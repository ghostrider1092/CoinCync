[lints.rust]
unsafe_code  = "allow"
missing_docs = "allow"

[lints.clippy]
# Three-tier priority hierarchy:
#
#   priority = -2  â€” broadest catch-all groups (all / pedantic / nursery)
#   priority = -1  â€” specific groups we want to enforce (correctness, suspicious)
#   priority =  0  â€” individual lint overrides (unwrap_used, expect_used)
#
# Why three tiers and not two:
#
# Cargo's `clippy::lint_groups_priority` check rejects a config where a
# lint group and an individual lint that belongs to the same group sit at
# the same numeric priority, because the outcome would depend on file
# ordering (which Cargo explicitly ignores). So `correctness = "warn"`
# and `unwrap_used = "allow"` (which IS a correctness lint) can't both
# live at priority 0. Pushing `correctness` down to -1 resolves it:
# `unwrap_used` at priority 0 still wins, so wallet/crypto code can keep
# using `.unwrap()` in `#[cfg(test)]` blocks and the handful of places
# where panic is the right behavior, while EVERY OTHER correctness lint
# fires as a warning on every build. Same story for `suspicious`.
#
# The broadest groups then move to priority -2 so `correctness = "warn"`
# at -1 still wins against them. Without this, `all = "allow"` at -1
# would tie with `correctness = "warn"` at -1 and we'd be back to
# file-ordering roulette.

all          = { level = "allow", priority = -2 }
pedantic     = { level = "allow", priority = -2 }
nursery      = { level = "allow", priority = -2 }
correctness  = { level = "warn",  priority = -1 }
suspicious   = { level = "warn",  priority = -1 }
unwrap_used  = "allow"
expect_used  = "allow"

# AUDIT (2026-06-30 M1+M2): individually-enabled lints that catch the
# specific bug classes we've hit in consensus code without spraying
# warnings across the whole codebase.
#
# - cast_possible_truncation / cast_sign_loss / cast_lossless: exactly the
#   class of bug behind the 2026-06-15 S1 ASERT denominator issue
#   (dimensionally wrong int cast × unit).
# - unwrap_in_result: flags .unwrap() calls inside functions that already
#   return Result, where propagating the error via ? is nearly always
#   correct. Fires far less than unwrap_used and never in test-only code.
# - dbg_macro / print_stdout: catches dev-time leftovers.
#
# Keep at warn (not deny) initially — deny would fail the build on the ~600
# existing occurrences. Migrate to deny gradually as each subsystem is
# cleaned up (add #[deny(clippy::cast_possible_truncation)] at module scope
# once that module is clean).
cast_possible_truncation = "warn"
cast_sign_loss           = "warn"
cast_lossless            = "warn"
unwrap_in_result         = "warn"
dbg_macro                = "warn"
print_stdout             = "warn"
