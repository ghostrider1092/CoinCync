# â”€â”€ Benchmarks â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
# Run with: cargo bench --features "randomx testnet" --bench <name>
# Criterion provides its own harness, so we disable the default one.
[[bench]]
name = "crypto_hot_paths"
harness = false

[profile.release]
opt-level     = 3
lto           = "thin"
