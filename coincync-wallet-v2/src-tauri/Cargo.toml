[workspace]

[package]
name = "coincync-wallet-v2"
version = "1.0.10"
edition = "2021"
[build-dependencies]
# Must track the Tauri v1 line to match `tauri = "1.6"` below. A v2
# tauri-build (2.x) parses tauri.conf.json as the v2 schema and rejects
# v1 keys like `devPath`/`distDir`, breaking the build. Keep both on v1.
tauri-build = { version = "1.5", features = [] }
[dependencies]
tauri     = { version = "1.6", features = [ "process-relaunch", "notification-all", "shell-open"] }
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest   = { version = "0.13", features = ["json", "blocking"] }
dirs-next = "2.0"
tracing   = "0.1"
tracing-subscriber = "0.3"
zeroize = "1"
keyring = "4"
# Used by generate_rpc_key() to create a fresh 64-hex bearer key on
# first launch. Pinned to 0.8 to match the workspace-wide version
# elsewhere (root Cargo.toml + crates/coincync-rig/Cargo.toml).
# Pinned to 0.8 to match the code in main.rs (`thread_rng()` +
# `RngCore::fill_bytes`). A prior bump to "0.10" pulled a crate whose
# API has no root `thread_rng`/`RngCore`, breaking the RPC-key generator.
# 0.8's ThreadRng is a CSPRNG — correct for a bearer-key generator.
rand = "0.8"
# QR code rendering for the Receive page. SVG output keeps the bundle
# small and scales cleanly. Same version as the workspace-wide pin in
# the root Cargo.toml.
qrcode = "0.14"
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Cyncswap (CIP-001 atomic swap) commands. Off by default â€” they ship
# in v1.1 behind their own dedicated audit per the staged-mainnet
# decision (see docs/decisions/2026-05-20-staged-mainnet-and-cyncswap.md).
# v1.0 wallet ships without the swap_* Tauri commands at all so the
# audit firm doesn't see them on the v1.0 attack surface. Enable with
# `cargo build --features cyncswap` once cyncswap clears its own audit.
cyncswap = []
