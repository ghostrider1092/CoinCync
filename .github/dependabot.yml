version: 2
updates:
  # Core node + crates
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Consensus- and crypto-critical crates are NEVER auto-bumped.
    # A bump here can change proof formats, commitments, signatures,
    # hashing, PoW, on-disk format, or consensus serialization — any of
    # which can fork the chain or break funds. History: bumping
    # tari_bulletproofs_plus 0.4->0.5 dragged in a *pre-release*
    # curve25519-dalek 5.0.0-pre.6 and broke `main` (PR #202/#204).
    # These are upgraded ONLY by deliberate, reviewed, green-CI work.
    # See dependency policy G.2/G.3.
    ignore:
      - dependency-name: "curve25519-dalek"
      - dependency-name: "ed25519-dalek"
      - dependency-name: "x25519-dalek"
      - dependency-name: "frost-ed25519"
      - dependency-name: "tari_bulletproofs_plus"
      - dependency-name: "merlin"
      - dependency-name: "incrementalmerkletree"
      - dependency-name: "orchard"
      - dependency-name: "group"
      - dependency-name: "subtle"
      - dependency-name: "borsh"
      - dependency-name: "randomx-rs"
      - dependency-name: "rocksdb"
      - dependency-name: "sha2"
      - dependency-name: "sha3"
      - dependency-name: "blake3"
      - dependency-name: "blake2b_simd"
      - dependency-name: "bloomfilter"

  # Tauri desktop wallet v2 (Rust side)
  - package-ecosystem: "cargo"
    directory: "/coincync-wallet-v2/src-tauri"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
      - "wallet"
    commit-message:
      prefix: "deps(wallet)"
      include: "scope"

  # Tauri desktop wallet v2 (JS side)
  - package-ecosystem: "npm"
    directory: "/coincync-wallet-v2"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "javascript"
      - "wallet"
    commit-message:
      prefix: "deps(wallet-js)"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
