name: Lint

# rustfmt + clippy gate. Complements the existing CI suite (integration-tests,
# coverage, audit, fuzz, critical-lock, hardening-baseline, verify-reproducible),
# none of which ran rustfmt or clippy — this was the one real gap in the lint
# surface.
#
# rustfmt is a HARD gate; the cast-lint ratchet is now a HARD gate too; the
# broad clippy `-D warnings` job is still an informational ratchet.
#
#   - rustfmt: the one-time reformat has landed (the non-locked workspace is
#     rustfmt-clean). The gate runs `scripts/fmt.sh --check`, NOT a plain
#     `cargo fmt --all --check`: the lock-protected consensus core is deliberately
#     kept byte-stable (rustfmt's `ignore` is nightly-only, so a plain check would
#     red-fail on those files). The wrapper formats and restores the locked files,
#     then fails on any other drift. See scripts/fmt.sh + docs/design/modernization-roadmap.md.
#   - clippy: still `continue-on-error: true` — a warning backlog remains. Clear it
#     surface-by-surface, then delete that line (the `-D warnings` gate is wired).
#   - cast-ratchet: a HARD gate (scripts/clippy-ratchet.sh). The non-locked workspace
#     has been swept for lossy integer casts surface-by-surface; each swept file
#     carries a file-level #![deny(clippy::cast_*)]. The three cast lints are `warn`
#     (not deny) workspace-wide, so a PLAIN clippy warns on remaining casts but
#     exits 0; a swept file's #![deny] promotes them to errors there, so plain
#     clippy fails only on a NEW lossy cast in an already-swept file. This gate
#     passes today and catches regressions without waiting on the broad backlog.
#     The lock-protected consensus core is excluded (its casts move only in a
#     planned fingerprint-moving release).

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Pin to the repo's toolchain (rust-toolchain.toml → 1.88.0) and pull the
      # rustfmt component explicitly so the check runs the same formatter the
      # local gate does.
      - name: Install Rust toolchain (1.88.0 + rustfmt)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: rustfmt

      - name: rustfmt gate (excludes the lock-protected consensus core)
        # HARD gate. Uses scripts/fmt.sh --check so the audited consensus core
        # stays byte-stable; fails on any other formatting drift.
        run: bash scripts/fmt.sh --check

  clippy:
    name: clippy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (1.88.0 + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint-clippy-v1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libssl-dev pkg-config

      - name: cargo clippy
        # Honors the project's [lints.clippy] baseline in Cargo.toml
        # (all = allow @ priority -2, correctness/suspicious = warn). `-D warnings`
        # turns the configured warn-level lints into failures once promoted.
        # INFORMATIONAL until the warning backlog is cleared — promote by
        # deleting this line.
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --features "randomx testnet" -- -D warnings

  cast-ratchet:
    name: cast-ratchet
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (1.88.0 + clippy)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"
          components: clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint-clippy-v1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libssl-dev pkg-config

      - name: cast-lint ratchet gate (HARD)
        # Plain clippy fails ONLY on a new lossy cast in a file that already
        # carries #![deny(clippy::cast_*)] — the cast lints are warn workspace-wide,
        # so warnings don't fail the exit, but a file's #![deny] makes them errors.
        # Plus a floor guard that those deny blocks are not removed. Unlike the
        # informational clippy job above, this is a hard gate: it passes today and
        # fails only on a regression. See scripts/clippy-ratchet.sh.
        run: bash scripts/clippy-ratchet.sh
