name: Build CoinCync Wallet

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64

    runs-on: ${{ matrix.os }}
    env:
      COINCYNC_SIDECAR_TARGET: ${{ matrix.target }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt update
          sudo apt install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            cmake clang libssl-dev pkg-config

      - name: Install macOS chain build deps
        if: startsWith(matrix.os, 'macos')
        run: brew install cmake

      - name: Install frontend dependencies
        working-directory: coincync-wallet
        run: npm install

      - name: Build CoinCync chain binaries (bundled with wallet)
        # Two cargo invocations: the workspace root crate (coincync-node,
        # coincync-wallet) is built with the testnet feature, then the
        # separate coincync-rig crate (canonical retail miner) is built
        # via -p. Matches the pattern documented in
        # coincync-wallet/scripts/bundle-sidecars.js.
        run: |
          cargo build --release --target ${{ matrix.target }} --features "randomx testnet" --bin coincync-node --bin coincync-wallet
          cargo build --release --target ${{ matrix.target }} -p coincync-rig

      - name: Stage wallet sidecars
        working-directory: coincync-wallet
        run: node scripts/bundle-sidecars.js

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set in repo secrets to produce signed bundles when updater is enabled in tauri.conf.json.
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          projectPath: coincync-wallet
          args: --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coincync-wallet-${{ matrix.name }}
          path: |
            coincync-wallet/src-tauri/target/*/release/bundle/**/*.deb
            coincync-wallet/src-tauri/target/*/release/bundle/**/*.AppImage
            coincync-wallet/src-tauri/target/*/release/bundle/**/*.dmg
            coincync-wallet/src-tauri/target/*/release/bundle/**/*.msi
            coincync-wallet/src-tauri/target/*/release/bundle/**/*.exe
      - name: Attest wallet artifact provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            coincync-wallet/src-tauri/target/*/release/bundle/**/*.deb
            coincync-wallet/src-tauri/target/*/release/bundle/**/*.AppImage
            coincync-wallet/src-tauri/target/*/release/bundle/**/*.dmg
            coincync-wallet/src-tauri/target/*/release/bundle/**/*.msi
            coincync-wallet/src-tauri/target/*/release/bundle/**/*.exe
