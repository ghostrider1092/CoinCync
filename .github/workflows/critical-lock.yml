name: Critical lock integrity

on:
  pull_request:
    paths:
      - "critical_files.lock"
      - "build.rs"
      - "src/testnet.rs"
      - "src/constants.rs"
      - "src/consensus/difficulty.rs"
      - "src/consensus/pow.rs"
      - "src/consensus/validation.rs"
      - "src/emission/curve.rs"
  push:
    branches:
      - main
      - master
    paths:
      - "critical_files.lock"
      - "build.rs"
      - "src/testnet.rs"
      - "src/constants.rs"
      - "src/consensus/difficulty.rs"
      - "src/consensus/pow.rs"
      - "src/consensus/validation.rs"
      - "src/emission/curve.rs"

permissions:
  contents: read

jobs:
  verify-critical-lock:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang libssl-dev pkg-config

      # build.rs enforces critical_files.lock hash integrity for consensus files.
      - name: Verify critical lock integrity via build script
        run: cargo check -p coincync -q
