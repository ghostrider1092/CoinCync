name: Build Release Binaries

# Two ways to fire this workflow:
#
#   1. Automatic on tag push (v* — any tag starting with v):
#      `git tag -s v1.0.10-testnet -m "..."`
#      `git push origin v1.0.10-testnet`
#      Triggers a full build for all 4 platforms AND publishes the
#      binaries + SHA256SUMS to the matching GitHub Release.
#
#   2. Manual via workflow_dispatch with an explicit version input.
#      Use for re-running a release if the auto-publish job failed,
#      or for back-filling binaries on an older tag that shipped
#      Windows-only (this is what got v1.0.9-testnet-pre-audit into
#      a Windows-only state).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (must match an existing release)
        required: true
        default: v1.0.10-testnet

permissions:
  contents: write       # required by publish-release to upload assets
  id-token: write       # required by attest-build-provenance (Sigstore)
  attestations: write   # same

jobs:
  # Linux release binaries build via the CANONICAL reproducible
  # Docker path (`scripts/build-in-docker.sh` → `docker/builder.Dockerfile`).
  # This closes the gap the Dockerfile header (lines 26-35 as of this
  # commit) previously flagged: "the published binaries were not built
  # from this Dockerfile." Post-this-PR, every Linux release binary is
  # byte-identical to what any community member's
  # `bash scripts/build-in-docker.sh` produces at the same commit.
  #
  # macOS + Windows still use `cargo build` directly on their native
  # runners below — no Debian-Bookworm-equivalent reproducible-container
  # story on GitHub Actions for those platforms today.
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          # SOURCE_DATE_EPOCH is derived inside the Dockerfile from
          # `git log -1 --format=%ct`. Without full history HEAD's
          # committer-date falls back to the hard-coded 1714838400
          # constant — reproducible across two runs of THIS workflow
          # but NOT against a community member's fresh clone. Fetch
          # full depth so the timestamp matches the outside world.
          fetch-depth: 0

      - name: Reproducible Docker build (produces out/{binaries,SHA256SUMS})
        run: bash ./scripts/build-in-docker.sh --out "$PWD/out"

      - name: Package release tarball
        run: |
          mkdir pkg
          # The Docker artifacts stage produces:
          #   coincync-node, coincync-wallet, coincync-rig,
          #   coord, coord-cli, cyncswap
          # (see docker/builder.Dockerfile, artifacts stage COPY).
          # Copy the ones we ship in the Linux release tarball.
          cp out/coincync-node out/coincync-rig out/coincync-wallet out/cyncswap pkg/
          cp deploy/coincync-node.service release/README.md release/coincync.conf.example pkg/
          cp deploy/ops/verify-community-bootstrap.sh deploy/ops/install-testnet-node.sh pkg/
          chmod +x pkg/verify-community-bootstrap.sh pkg/install-testnet-node.sh
          # Re-generate SHA256SUMS.txt over the FULL tarball contents
          # (Docker's out/SHA256SUMS only covers the binaries; the
          # tarball has extra service files + install scripts too).
          cd pkg && sha256sum * > SHA256SUMS.txt && cd ..
          tar czf coincync-linux-x86_64.tar.gz -C pkg .

      - name: Verify tarball SHA256SUMS.txt matches what Docker produced
        run: |
          # Belt-and-suspenders: confirm the binary SHAs inside the
          # tarball match Docker's out/SHA256SUMS byte-for-byte. If a
          # future refactor accidentally copies from `target/release/`
          # (the non-Docker path) instead of `out/`, this catches it.
          for bin in coincync-node coincync-rig coincync-wallet cyncswap; do
            docker_sha="$(awk -v b=$bin '$2 == b {print $1}' out/SHA256SUMS)"
            pkg_sha="$(awk -v b=$bin '$2 == b {print $1}' pkg/SHA256SUMS.txt)"
            if [ "$docker_sha" != "$pkg_sha" ]; then
              echo "::error::$bin: docker=$docker_sha pkg=$pkg_sha (should match)"
              exit 1
            fi
            echo "OK $bin: $pkg_sha"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: coincync-linux-x86_64
          path: coincync-linux-x86_64.tar.gz
      - name: Attest Linux artifact provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: coincync-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build coincync (node + wallet)
        run: cargo build --release --features "randomx testnet" --bin coincync-node --bin coincync-wallet
      - name: Build coincync-rig (canonical retail miner)
        run: cargo build --release -p coincync-rig
      - name: Build cyncswap (atomic-swap state-machine CLI; crypto skeleton, see CIP-001)
        run: cargo build --release -p coincync-swap --bin cyncswap
      - name: Package
        shell: bash
        run: |
          mkdir pkg
          cp target/release/coincync-node.exe target/release/coincync-rig.exe target/release/coincync-wallet.exe target/release/cyncswap.exe pkg/
          cd pkg && sha256sum * > SHA256SUMS.txt && cd ..
          tar czf coincync-windows-x64.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: coincync-windows-x64
          path: coincync-windows-x64.tar.gz
      - name: Attest Windows artifact provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: coincync-windows-x64.tar.gz

  build-macos-intel:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: brew install cmake
      - name: Build coincync (node + wallet)
        run: cargo build --release --features "randomx testnet" --bin coincync-node --bin coincync-wallet
      - name: Build coincync-rig (canonical retail miner)
        run: cargo build --release -p coincync-rig
      - name: Build cyncswap (atomic-swap state-machine CLI; crypto skeleton, see CIP-001)
        run: cargo build --release -p coincync-swap --bin cyncswap
      - name: Package
        run: |
          mkdir pkg
          cp target/release/coincync-node target/release/coincync-rig target/release/coincync-wallet target/release/cyncswap pkg/
          cp deploy/coincync-node.service release/README.md release/coincync.conf.example pkg/
          cp deploy/ops/verify-community-bootstrap.sh deploy/ops/install-testnet-node.sh pkg/
          chmod +x pkg/verify-community-bootstrap.sh pkg/install-testnet-node.sh
          cd pkg && shasum -a 256 * > SHA256SUMS.txt && cd ..
          tar czf coincync-macos-x64.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: coincync-macos-x64
          path: coincync-macos-x64.tar.gz
      - name: Attest macOS x64 artifact provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: coincync-macos-x64.tar.gz

  build-macos-arm:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install deps
        run: brew install cmake
      - name: Build coincync (node + wallet)
        run: cargo build --release --features "randomx testnet" --bin coincync-node --bin coincync-wallet
      - name: Build coincync-rig (canonical retail miner)
        run: cargo build --release -p coincync-rig
      - name: Build cyncswap (atomic-swap state-machine CLI; crypto skeleton, see CIP-001)
        run: cargo build --release -p coincync-swap --bin cyncswap
      - name: Package
        run: |
          mkdir pkg
          cp target/release/coincync-node target/release/coincync-rig target/release/coincync-wallet target/release/cyncswap pkg/
          cp deploy/coincync-node.service release/README.md release/coincync.conf.example pkg/
          cp deploy/ops/verify-community-bootstrap.sh deploy/ops/install-testnet-node.sh pkg/
          chmod +x pkg/verify-community-bootstrap.sh pkg/install-testnet-node.sh
          cd pkg && shasum -a 256 * > SHA256SUMS.txt && cd ..
          tar czf coincync-macos-arm64.tar.gz -C pkg .
      - uses: actions/upload-artifact@v4
        with:
          name: coincync-macos-arm64
          path: coincync-macos-arm64.tar.gz
      - name: Attest macOS arm64 artifact provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: coincync-macos-arm64.tar.gz

  # ─── Publish ─────────────────────────────────────────────────────
  #
  # Without this job the 4 platform builds produce artifacts that
  # live in workflow scratch for 90 days, then expire silently.
  # Operators had to manually download and re-upload each per-
  # release — which is why v1.0.9-testnet-pre-audit shipped with
  # Windows binaries only (Linux + macOS jobs succeeded but the
  # operator only downloaded one). This job downloads all 4
  # platform tarballs, generates a combined SHA256SUMS across
  # them, and attaches everything to the matching GitHub Release.
  #
  # Runs only when triggered by a tag push OR when workflow_dispatch
  # provides an existing tag in the `version` input.
  publish-release:
    needs: [build-linux, build-windows, build-macos-intel, build-macos-arm]
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ inputs.version }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing release for tag: $TAG"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate combined SHA256SUMS.txt
        run: |
          mkdir -p release-bundle
          # Move each platform tarball up one level, alongside SHA256SUMS.
          for d in artifacts/*/; do
            cp "$d"/*.tar.gz release-bundle/
          done
          cd release-bundle
          # Cross-platform SHA file the verify-reproducible-build.ps1
          # script consumes. One line per tarball; reproducible across
          # operator boxes since sha256sum is deterministic.
          sha256sum *.tar.gz > SHA256SUMS.txt
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            release-bundle/*.tar.gz
            release-bundle/SHA256SUMS.txt
          fail_on_unmatched_files: true
          # If the release doesn't exist yet (rare — usually the tag
          # push has already created it via GitHub's auto-release),
          # create it. Body is intentionally empty here; release notes
          # are authored manually post-publish to allow per-release
          # narrative + breaking-change callouts.
          generate_release_notes: false
          append_body: false
