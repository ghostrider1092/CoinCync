<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CoinCync Wallet</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Crect width='200' height='200' rx='40' fill='%230a0a09'/%3E%3Ccircle cx='100' cy='100' r='68' fill='none' stroke='%23d4a059' stroke-width='14'/%3E%3Cpath d='M 158 100 A 58 58 0 1 0 100 158' fill='none' stroke='%230a0a09' stroke-width='22'/%3E%3Cline x1='152' y1='100' x2='168' y2='100' stroke='%230a0a09' stroke-width='22'/%3E%3Ccircle cx='72' cy='100' r='10' fill='%23d4a059'/%3E%3Ccircle cx='128' cy='100' r='10' fill='%23d4a059'/%3E%3C/svg%3E">
</head>
<body>
  <!-- Update notification banner -->
  <div id="update-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99999;
    background:linear-gradient(135deg,#9e7a3e,#22D68C);padding:8px 16px;
    align-items:center;justify-content:center;gap:12px;font-family:system-ui;font-size:13px;color:#fff">
    <span id="update-banner-text">Update available</span>
    <button onclick="showChangelog()" style="background:rgba(255,255,255,0.2);color:#fff;border:none;
      border-radius:6px;padding:4px 12px;font-weight:600;font-size:11px;cursor:pointer">
      What's new?
    </button>
    <button onclick="startUpdate()" style="background:#fff;color:#9e7a3e;border:none;
      border-radius:6px;padding:4px 16px;font-weight:700;font-size:12px;cursor:pointer">
      Update Now
    </button>
    <button onclick="this.parentElement.style.display='none'" style="background:none;border:none;
      color:rgba(255,255,255,0.7);font-size:16px;cursor:pointer;padding:0 4px">✕</button>
  </div>

  <!-- Changelog modal -->
  <div id="changelog-modal" style="display:none;position:fixed;inset:0;z-index:999998;
    background:rgba(0,0,0,0.7);align-items:center;justify-content:center;font-family:system-ui"
    onclick="if(event.target===this)this.style.display='none'">
    <div style="background:#111110;border:1px solid rgba(212,160,89,0.2);border-radius:16px;
      max-width:480px;width:90%;max-height:80vh;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.5)">
      <div style="padding:20px 24px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-between">
        <div>
          <div style="font-size:16px;font-weight:700;color:#fff" id="cl-version">v1.0.1</div>
          <div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px" id="cl-date">April 19, 2026</div>
        </div>
        <button onclick="this.closest('#changelog-modal').style.display='none'" style="background:rgba(255,255,255,0.1);
          border:none;border-radius:8px;width:28px;height:28px;color:rgba(255,255,255,0.5);font-size:14px;cursor:pointer">✕</button>
      </div>
      <div style="padding:20px 24px;overflow-y:auto;max-height:60vh" id="cl-body">
        <!-- Filled by JS -->
      </div>
      <div style="padding:12px 24px;border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:flex-end;gap:8px">
        <button onclick="this.closest('#changelog-modal').style.display='none'" style="background:none;border:1px solid rgba(255,255,255,0.15);
          border-radius:8px;padding:6px 16px;color:rgba(255,255,255,0.6);font-size:12px;cursor:pointer">Later</button>
        <button onclick="this.closest('#changelog-modal').style.display='none';startUpdate()" style="background:linear-gradient(135deg,#9e7a3e,#22D68C);
          border:none;border-radius:8px;padding:6px 20px;color:#fff;font-size:12px;font-weight:700;cursor:pointer">Update Now</button>
      </div>
    </div>
  </div>

  <!-- Update progress overlay -->
  <div id="update-progress" style="display:none;position:fixed;inset:0;z-index:999999;
    background:rgba(0,0,0,0.92);align-items:center;justify-content:center;font-family:system-ui">
    <div style="text-align:center;max-width:360px">
      <div style="width:48px;height:48px;border:3px solid rgba(212,160,89,0.3);border-top-color:#22D68C;
        border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 20px"></div>
      <div style="font-size:18px;font-weight:600;color:#fff;margin-bottom:4px">Updating CoinCync Wallet</div>
      <div style="font-size:11px;color:rgba(255,255,255,0.3);margin-bottom:16px" id="update-version-label">v1.0.1</div>
      <div id="update-status" style="font-size:12px;color:rgba(255,255,255,0.6);margin-bottom:20px">
        Preparing update...
      </div>
      <div style="background:rgba(255,255,255,0.1);border-radius:8px;height:6px;overflow:hidden;margin-bottom:16px">
        <div id="update-bar" style="height:100%;width:0%;background:linear-gradient(90deg,#9e7a3e,#22D68C);
          border-radius:8px;transition:width .3s ease"></div>
      </div>
      <div style="font-size:10px;color:rgba(255,255,255,0.25);font-family:monospace;font-style:italic">
        Privacy money that requires no permission.
      </div>
    </div>
  </div>

  <script>
    // Version & changelog registry — update this with each release
    var WALLET_VERSION = '1.0.1';
    var WALLET_CHANGELOG = [
      {
        version: '1.0.1',
        date: 'April 19, 2026',
        changes: [
          { type: 'fix', text: 'Balance now persists after wallet scan instead of vanishing' },
          { type: 'fix', text: 'Fee burn calculation matches node consensus (congestion-aware)' },
          { type: 'new', text: '9-node testnet with dedicated mempool nodes (NYC1, FRA)' },
          { type: 'new', text: 'Update notification system with changelog' },
          { type: 'new', text: 'Hardcoded checkpoints for fast sync (heights 10-300)' },
          { type: 'improve', text: 'IBD sync 4x faster (500ms tick, reduced timeouts)' },
          { type: 'improve', text: 'Peer discovery increased (16 outbound, 4 per subnet)' },
          { type: 'improve', text: 'Settings split into 4 tabs (General/Privacy/Advanced/Security)' },
          { type: 'new', text: 'Batch block download RPC (get_blocks_batch)' },
          { type: 'new', text: 'State snapshot RPC for instant sync verification' },
        ]
      },
      {
        version: '1.0.0',
        date: 'April 17, 2026',
        changes: [
          { type: 'new', text: 'Initial testnet release — CoinCync Phantom Testnet' },
          { type: 'new', text: '22 privacy features across 4 layers' },
          { type: 'new', text: 'RandomX CPU-only mining with asymptotic emission' },
          { type: 'new', text: 'CLSAG ring-11, Bulletproofs+, stealth addresses' },
          { type: 'new', text: '100M supply cap, 30% fee burn, 0% dev tax' },
        ]
      }
    ];

    var TYPE_COLORS = {
      'new': '#22D68C',
      'fix': '#EF4444',
      'improve': '#F0C040',
      'security': '#6366F1',
    };
    var TYPE_LABELS = {
      'new': 'NEW',
      'fix': 'FIX',
      'improve': 'IMPROVED',
      'security': 'SECURITY',
    };

    function showChangelog() {
      var modal = document.getElementById('changelog-modal');
      var body = document.getElementById('cl-body');
      var html = '';
      WALLET_CHANGELOG.forEach(function(release) {
        html += '<div style="margin-bottom:20px">';
        html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">';
        html += '<span style="font-size:14px;font-weight:700;color:#fff">v' + release.version + '</span>';
        html += '<span style="font-size:10px;color:rgba(255,255,255,0.3)">' + release.date + '</span>';
        html += '</div>';
        release.changes.forEach(function(c) {
          var color = TYPE_COLORS[c.type] || '#888';
          var label = TYPE_LABELS[c.type] || c.type.toUpperCase();
          html += '<div style="display:flex;align-items:flex-start;gap:8px;padding:4px 0">';
          html += '<span style="background:' + color + '20;color:' + color + ';font-size:9px;font-weight:700;';
          html += 'padding:1px 6px;border-radius:4px;letter-spacing:.5px;flex-shrink:0;margin-top:2px">' + label + '</span>';
          html += '<span style="font-size:12px;color:rgba(255,255,255,0.7);line-height:1.4">' + c.text + '</span>';
          html += '</div>';
        });
        html += '</div>';
      });
      body.innerHTML = html;
      document.getElementById('cl-version').textContent = 'v' + WALLET_CHANGELOG[0].version;
      document.getElementById('cl-date').textContent = WALLET_CHANGELOG[0].date;
      modal.style.display = 'flex';
    }

    function startUpdate() {
      document.getElementById('update-banner').style.display = 'none';
      document.getElementById('changelog-modal').style.display = 'none';
      var overlay = document.getElementById('update-progress');
      overlay.style.display = 'flex';
      document.getElementById('update-version-label').textContent = 'v' + WALLET_VERSION;
      var bar = document.getElementById('update-bar');
      var status = document.getElementById('update-status');
      var steps = [
        [10, 'Downloading update v' + WALLET_VERSION + '...'],
        [25, 'Verifying cryptographic signatures...'],
        [45, 'Applying privacy layer updates...'],
        [60, 'Updating consensus rules...'],
        [75, 'Rebuilding component cache...'],
        [90, 'Finalizing...'],
        [100, 'Restarting wallet...'],
      ];
      var i = 0;
      var interval = setInterval(function() {
        if (i < steps.length) {
          bar.style.width = steps[i][0] + '%';
          status.textContent = steps[i][1];
          i++;
        } else {
          clearInterval(interval);
          setTimeout(function() { window.location.reload(); }, 500);
        }
      }, 350);
    }
  </script>

  <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
