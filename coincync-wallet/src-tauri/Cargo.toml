[workspace]

[package]
name = "coincync-wallet"
version = "1.0.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "1.5", features = [] }
[dependencies]
tauri     = { version = "1.6", features = [ "process-relaunch", "notification-all", "shell-open"] }
serde     = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest   = { version = "0.11", features = ["json", "blocking"] }
dirs-next = "2.0"
tracing   = "0.1"
tracing-subscriber = "0.3"
zeroize = "1"
keyring = "2"
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
