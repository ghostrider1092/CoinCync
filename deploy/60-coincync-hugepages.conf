# CoinCync miner boxes — reserve 2 MB huge pages for the full-mem RandomX dataset.
#
# Install ONLY on boxes running the full-mem miner (coincync-fullmem-miner.service
# / `coincync-rig run-solo`). NOT needed on light-mode validating `coincync-node`
# boxes — they never build the 2 GB dataset, so this path is a no-op for them.
#
# 1280 x 2 MB = 2.56 GB: covers the ~2.3 GB RandomX dataset + per-thread 2 MB
# scratchpads with headroom. Raise it if the miner runs many `--threads`
# (dataset pages + one per thread). On an 8 GB co-located node+miner box this
# leaves ~5 GB for the (light-mode) node + OS.
#
# Install:
#   sudo cp deploy/60-coincync-hugepages.conf /etc/sysctl.d/
#   sudo sysctl --system
#   grep HugePages /proc/meminfo   # expect HugePages_Total: 1280
#
# The miner service already sets LimitMEMLOCK=infinity so it can map them.
# RandomX requests huge pages automatically when reserved and falls back to
# 4 KB pages (with a loud warning) when they are not — so a box without this
# drop-in still mines, just ~2x slower. See the perf(pow) huge-pages change.
vm.nr_hugepages = 1280
