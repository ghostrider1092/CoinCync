# coincync-tick sidecar configuration (CoincyncAdapterConfig).
# Install at /etc/coincync-tick/config.toml.

# Deployment mode:
#   "personal" — monitor only the local node (host + node health).
#   "fleet"    — additionally probe fleet peers and report
#                aggregate_fleet_health (uses fleet_config_path below).
deployment_mode = "personal"

# Local coincync-node JSON-RPC endpoint (loopback).
local_rpc_url = "http://127.0.0.1:28081"

# Bearer token file — the SAME token the node's RPC auth uses. The sidecar
# reads it (never logs it) to authenticate its get_info calls.
local_rpc_token_path = "/etc/coincync/rpc-token"

# Fleet peer list. Only consulted when deployment_mode = "fleet".
fleet_config_path = "/etc/coincync-tick/fleet-config.json"

# ── Colony (optional, off by default) ────────────────────────────────────────
# The colony is enabled by CLI flags on the ExecStart line, NOT here:
#   --colony-observe / --colony-advise / --castes-observe
# All are read-only and log-only — they change no node behaviour and observe no
# transaction. --castes-observe additionally runs the honeybee->guards spine,
# which corroborates caste detections and logs a quorum-gated verdict
# ("colony/spine: ..."). spider/sensor only produce evidence with a fleet
# aggregate, so set deployment_mode = "fleet" on the aggregator to exercise it.
# See deploy/coincync-tick-runbook.md, "caste suite + act-phase spine".
#
# Example fleet-config.json (one shared rpc_port; hosts keyed by IP; role "api"
# is excluded from the probed set):
#   { "rpc_port": 28081,
#     "nodes": {
#       "seed1": { "ip": "A.B.C.D", "rpc_bind": "0.0.0.0", "role": "seed" },
#       "seed2": { "ip": "E.F.G.H", "rpc_bind": "0.0.0.0", "role": "seed" }
#     } }