global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    chain: 'coincync-testnet'

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:

  # ── CoinCync 1.0 nodes ────────────────────────────────────────
  - job_name: 'coincync-nodes'
    static_configs:
      - targets:
          # 2026-10-19: the earlier 5-node Vultr roster (66.135.23.193,
          # 140.82.57.168, 207.148.6.50, 207.148.111.76, 95.179.165.225)
          # is decommissioned. The current testnet is a single published
          # seed; community peers are not scraped. Point this at the seed's
          # metrics endpoint (:9091) from a host that can reach it —
          # metrics are not public, so run Prometheus on/next to the seed
          # or over a private link. Re-populate as the fleet grows.
          - '2.29.34.197:9091'    # seed1 — published testnet seed
        labels:
          network: testnet
    relabel_configs:
      - source_labels: [__address__]
        regex: '45\.55\.32\.13:.*'
        target_label: node_label
        replacement: NYC
      - source_labels: [__address__]
        regex: '165\.245\.161\.62:.*'
        target_label: node_label
        replacement: RIC
      - source_labels: [__address__]
        regex: '143\.110\.218\.99:.*'
        target_label: node_label
        replacement: TOR
      - source_labels: [__address__]
        regex: '165\.245\.140\.113:.*'
        target_label: node_label
        replacement: ATL
      - source_labels: [__address__]
        regex: '64\.227\.49\.44:.*'
        target_label: node_label
        replacement: SFO
      - source_labels: [__address__]
        regex: '138\.68\.172\.80:.*'
        target_label: node_label
        replacement: LON
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 10s

  # ── Prometheus self-monitoring ─────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
