global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    chain: 'coincync-testnet'

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:

  # ── CoinCync 1.0 nodes ────────────────────────────────────────
  - job_name: 'coincync-nodes'
    static_configs:
      - targets:
          # 2026-06-06: scraped fleet rewritten to the live 5-node
          # Vultr roster. Dead targets (45.55.32.13, 138.68.172.80,
          # 192.34.59.42, 46.101.138.120, 165.245.161.62, 143.110.218.99,
          # 165.245.140.113, 64.227.49.44, 164.92.153.24, 170.64.142.146)
          # were removed — those boxes are decommissioned or never
          # existed in the live fleet.
          - '66.135.23.193:9091'    # seed1 — New York
          - '140.82.57.168:9091'    # seed2 — Amsterdam
          - '207.148.6.50:9091'     # explorer — Dallas
          - '207.148.111.76:9091'   # seed3 — Tokyo
          - '95.179.165.225:9091'   # api — Frankfurt
        labels:
          network: testnet
    relabel_configs:
      - source_labels: [__address__]
        regex: '45\.55\.32\.13:.*'
        target_label: node_label
        replacement: NYC
      - source_labels: [__address__]
        regex: '165\.245\.161\.62:.*'
        target_label: node_label
        replacement: RIC
      - source_labels: [__address__]
        regex: '143\.110\.218\.99:.*'
        target_label: node_label
        replacement: TOR
      - source_labels: [__address__]
        regex: '165\.245\.140\.113:.*'
        target_label: node_label
        replacement: ATL
      - source_labels: [__address__]
        regex: '64\.227\.49\.44:.*'
        target_label: node_label
        replacement: SFO
      - source_labels: [__address__]
        regex: '138\.68\.172\.80:.*'
        target_label: node_label
        replacement: LON
    metrics_path: /metrics
    scheme: http
    scrape_timeout: 10s

  # ── Prometheus self-monitoring ─────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
