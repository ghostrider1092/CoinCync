# Systemd drop-in for `coincync-node.service` — grants CAP_SYS_PTRACE
# so the in-process runtime watchdog (src/runtime_watchdog.rs) can read
# each thread's kernel stack via /proc/self/task/<tid>/stack. Without
# this capability, the unprivileged `coincync` user gets an empty
# `kernel_stack_head` field in every diagnostic dump — verified in
# production 2026-07-02 (api box) and 2026-07-03 (relay1) where every
# per-thread line landed with `kernel_stack_head=[]`.
#
# ── DEPLOY ──
# Copy this file to `/etc/systemd/system/coincync-node.service.d/cap-sys-ptrace.conf`
# then reload + restart:
#
#     sudo mkdir -p /etc/systemd/system/coincync-node.service.d/
#     sudo cp scripts/systemd-drop-in-cap-sys-ptrace.conf \
#         /etc/systemd/system/coincync-node.service.d/cap-sys-ptrace.conf
#     sudo chmod 0644 /etc/systemd/system/coincync-node.service.d/cap-sys-ptrace.conf
#     sudo systemctl daemon-reload
#     # then restart THIS ONE HOST only, respecting the fleet mesh gate:
#     sudo systemctl restart coincync-node
#
# ── VERIFY ──
# After restart, confirm the capability landed:
#
#     grep Cap /proc/$(pgrep -f coincync-node)/status
#
# You should see `CapPrm` and `CapEff` include bit 19 (CAP_SYS_PTRACE)
# — decoded via `capsh --decode=<hexvalue>`. If CapEff is 0, the
# ambient-capability grant didn't stick (usually because the systemd
# unit's User= drops privs BEFORE ambient capabilities are applied on
# very old systemd versions — Ubuntu 20.04+ / Debian 11+ are fine).
#
# ── SECURITY TRADEOFFS ──
# CAP_SYS_PTRACE is powerful. In detail, it lets the coincync-node
# process:
#
#   1. Read /proc/self/task/*/stack (the ONLY thing we actually want)
#   2. `ptrace(PTRACE_ATTACH)` on other processes owned by the same
#      user (`coincync`)
#   3. Read /proc/<pid>/mem for those processes
#   4. Bypass `/proc/sys/kernel/yama/ptrace_scope=1` for its own children
#
# On a coincync fleet host, the `coincync` user typically owns ONLY the
# coincync-node + coincync-rig processes and the RocksDB data dir. So an
# attacker who compromises coincync-node with this cap could:
#
#   - Inspect / modify coincync-rig's memory
#   - Inspect / modify a second coincync-node instance if one exists
#     (not the case on the fleet — one node per host)
#
# The cap does NOT grant:
#
#   - ptrace of ROOT-owned processes (kernel enforces UID barrier
#     independently of CAP_SYS_PTRACE unless CAP_SYS_ADMIN is also
#     present — which it isn't)
#   - filesystem writes outside /var/lib/coincync
#   - network privileges
#   - kernel module load
#
# ── ROLLOUT STRATEGY ──
# Do NOT apply to every host at once. Recommended sequence:
#
#   1. seed3 (least critical fleet host) — apply, restart, hold 24h
#      watching for regressions or unexpected watchdog fires
#   2. relay1 or randomx2 — apply next
#   3. remaining fleet — apply as diagnostic need arises
#
# The api box + explorer host + seed1 (largest peer graphs) should be
# LAST because they're the most exposed. The point of enabling this
# is to catch the NEXT deadlock with full stack; if the fleet at large
# doesn't deadlock again, you don't need it fleet-wide.
#
# ── LEAVE ROOM TO REVERT ──
# To revoke the capability without downtime, delete the drop-in file
# and `systemctl daemon-reload && systemctl restart coincync-node`.
# The empty `kernel_stack_head=[]` degradation is graceful — the
# watchdog still fires, still aborts, still dumps every other field.

[Service]
# Grant CAP_SYS_PTRACE ambient so `/proc/self/task/*/stack` reads
# succeed under the unprivileged `coincync` user. Keep the bounding
# set narrow — do NOT expand to CAP_SYS_ADMIN etc.
AmbientCapabilities=CAP_SYS_PTRACE
CapabilityBoundingSet=CAP_SYS_PTRACE CAP_NET_BIND_SERVICE
# Belt-and-suspenders: even with the cap, allow /proc reads to work
# under yama.ptrace_scope=1 for our own threads. On yama.ptrace_scope=2
# or higher, kernel-stack reads may still fail — that would need a
# host-level `sysctl kernel.yama.ptrace_scope=0` (do NOT touch this
# on a shared host; it weakens the whole host's ptrace policy).
