# deny.toml — cargo-deny policy for CoinCync
# Reviewed policy: accepted licenses, advisory handling, dependency sources,
# duplicate-version handling. Per Jun's guidance, duplicate versions are
# review findings (warn), not automatic failures.

[advisories]
# Deny-by-default: any RUSTSEC advisory fails unless explicitly ignored below
# with a written justification. Yanked crates are rejected.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Add specific advisories here ONLY with a justification comment, e.g.:
    # "RUSTSEC-2026-0190", # fuzz-only dep (Error::downcast_mut unsoundness); not in shipped product
]

[licenses]
# Permissive licenses appropriate for a FOSS privacy coin. MPL-2.0 (file-level
# copyleft) is accepted; strong copyleft (GPL/AGPL) is intentionally absent and
# will fail the check so it surfaces for review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",              # Boost Software License — permissive (clipboard-win, error-code via rustyline dev-dep)
    "CDLA-Permissive-2.0",  # Community Data License (permissive) — webpki-root-certs root-cert data
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
]
confidence-threshold = 0.9
# Per-crate license exceptions go here with justification, e.g.:
# exceptions = [{ allow = ["OpenSSL"], crate = "ring" }]
exceptions = []

[bans]
# Duplicate versions surface as review findings, not hard failures.
multiple-versions = "warn"
# Wildcards are review findings, not hard failures. The only wildcards here are
# internal workspace path deps (bridge/tick) lacking version pins — harmless for
# an unpublished workspace. (To make this "deny"-clean later, mark the app crates
# `publish = false` or add version fields to their path deps.)
wildcards = "warn"
allow-wildcard-paths = true
# Crates explicitly banned (with a reason) go in `deny = [...]`.

[sources]
# Only crates.io and explicitly-allowed git sources are permitted.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
