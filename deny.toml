# deny.toml — cargo-deny policy for CoinCync.
#
# SCOPE: this policy governs LICENSES, BANS, and SOURCES only. Advisory
# scanning is handled by `cargo audit` (root + fuzz/Cargo.lock) — cargo-deny's
# bundled advisory-db parser currently rejects a CVSS-4.0 entry, so we do not
# rely on `cargo deny check advisories`. CI runs: `cargo deny check licenses
# bans sources`. Per Jun's review, do not describe this as a full cargo-deny
# advisory pass.
#
# Duplicate versions and internal path-dep wildcards are review-level warnings,
# not hard failures.

[licenses]
# Permissive licenses appropriate for a FOSS privacy coin. Strong copyleft
# (GPL/AGPL) is intentionally absent and will fail so it surfaces for review.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",              # Boost Software License — permissive (clipboard-win / error-code via rustyline)
    "CDLA-Permissive-2.0",  # Community Data License (permissive) — webpki-root-certs root-cert data
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
]
confidence-threshold = 0.9
exceptions = []

[bans]
# Duplicate versions surface as review findings, not hard failures.
multiple-versions = "warn"
# Wildcards are review findings too. The only wildcards are internal workspace
# path deps lacking version pins — harmless for an unpublished workspace.
wildcards = "warn"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
