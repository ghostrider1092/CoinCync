# CoinCync Critical File Integrity Lockfile
#
# These SHA-256 hashes protect consensus-critical files from accidental changes.
# The build will FAIL if any hash doesn't match.
#
# Hashes are computed over the file bytes with CRLF line endings
# normalized to LF, so Windows and Linux produce the same values.
#
# To refresh after an INTENTIONAL change:
#   COINCYNC_REGEN_LOCK=1 cargo run --locked --bin update-critical-hashes
#
# NEVER refresh these hashes without a thorough review of the changes.
# Accidental modifications to these files can cause chain forks.

