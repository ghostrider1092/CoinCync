<?xml version="1.0" encoding="UTF-8"?>
<!--
  CoinCync Wallpaper: "The Library" — Landscape
  3840×2160.

  A wallpaper-scaled reinterpretation of the reading-room banner:
  more atmosphere, less narrative. Architectural silhouettes —
  an arched window, bookshelf lines, a brass astrolabe silhouette.
  Composed so the center of the screen (where desktop icons live)
  is visually quiet. Warm darks at edges, slightly lighter middle.
-->
