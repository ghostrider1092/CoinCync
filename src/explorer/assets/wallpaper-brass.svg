<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <!-- CoinCync Wallpaper — Reversed / Ink on Brass -->
  <defs>
    <linearGradient id="brass-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#daa860"/>
      <stop offset="30%" stop-color="#d4a059"/>
      <stop offset="70%" stop-color="#c89548"/>
      <stop offset="100%" stop-color="#d4a059"/>
    </linearGradient>
    <radialGradient id="highlight" cx="35%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#e8b86d" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <pattern id="metal" width="200" height="200" patternUnits="userSpaceOnUse">
      <filter id="mnoise"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
      <rect width="200" height="200" filter="url(#mnoise)" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#brass-bg)"/>
  <rect width="1920" height="1080" fill="url(#highlight)"/>
  <rect width="1920" height="1080" fill="url(#metal)"/>

  <!-- Faint construction lines -->
  <line x1="960" y1="300" x2="960" y2="780" stroke="rgba(58,51,40,0.06)" stroke-width="0.5"/>
  <line x1="720" y1="540" x2="1200" y2="540" stroke="rgba(58,51,40,0.06)" stroke-width="0.5"/>
  <circle cx="960" cy="540" r="100" fill="none" stroke="rgba(58,51,40,0.04)" stroke-width="0.5" stroke-dasharray="4 6"/>

  <!-- Centered mark -->
  <g transform="translate(960,540)">
    <circle cx="0" cy="0" r="180" fill="none" stroke="#3a3328" stroke-width="16" opacity="0.9"/>
    <path d="M 157 0 A 157 157 0 1 0 0 157" fill="none" stroke="#d4a059" stroke-width="28"/>
    <line x1="152" y1="0" x2="196" y2="0" stroke="#d4a059" stroke-width="28"/>
    <circle cx="-75" cy="0" r="18" fill="#3a3328" opacity="0.9"/>
    <circle cx="75" cy="0" r="18" fill="#3a3328" opacity="0.9"/>
  </g>

  <!-- Corner accents -->
  <line x1="60" y1="60" x2="140" y2="60" stroke="rgba(58,51,40,0.08)" stroke-width="0.5"/>
  <line x1="60" y1="60" x2="60" y2="140" stroke="rgba(58,51,40,0.08)" stroke-width="0.5"/>
  <line x1="1860" y1="1020" x2="1780" y2="1020" stroke="rgba(58,51,40,0.08)" stroke-width="0.5"/>
  <line x1="1860" y1="1020" x2="1860" y2="940" stroke="rgba(58,51,40,0.08)" stroke-width="0.5"/>
</svg>
