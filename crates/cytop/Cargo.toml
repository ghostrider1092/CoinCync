[package]
name         = "cytop"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
authors      = ["CoinCync 1.0 Contributors"]
description  = "cytop — a from-scratch, btop-architecture system + CoinCync node monitor in Rust."
license      = "MIT"
publish      = false

# coincync-top v2, done right: a real btop-style architecture — a theme engine
# that parses btop's own .theme files (101-step gradients), trait-based metric
# collectors, and a draw layer of reusable primitives (boxes, ■ meters, braille
# graphs) — plus the CoinCync node/chain panels. Pure client; depends on nothing
# in the core crate, so it builds and runs independently.

[[bin]]
name = "cytop"
path = "src/main.rs"

[dependencies]
ratatui    = "0.30"
crossterm  = "0.29"
sysinfo    = "0.32"
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde_json = "1"
clap       = { version = "4", features = ["derive", "env"] }
anyhow     = "1"
