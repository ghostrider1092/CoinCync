[package]
name         = "coincync-rig"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
authors      = ["CoinCync 1.0 Contributors"]
description  = "CoinCync canonical CPU miner — solo + Stratum, RandomX over a blake3-prehashed input."
license      = "MIT"
publish      = false

# Canonical CPU miner. Reuses `coincync::consensus::compute_pow_hash` so
# there's one source of truth for "what is a valid block hash" between
# miner and validator. Stratum client (Bitcoin-style: subscribe /
# authorize / submit), per-thread workers with a shared RandomX dataset,
# TOML config + CLI, benchmark + hash verifier subcommands. Failover
# pools and a ratatui dashboard are post-launch additions.

[[bin]]
name = "coincync-rig"
path = "src/main.rs"

[features]
# Testnet consensus constants. Forwards to the parent crate's `testnet`
# feature so a testnet/regtest miner links the SAME feature-gated
# consensus values as the daemon it mines for — most importantly
# `FEE_DISTRIBUTION_HEIGHT` (testnet 525 / mainnet 0), which controls when
# the coinbase fee-burn split activates. Without a matching build the rig
# would compute a coinbase the validator rejects for blocks below the
# activation height. Build with `--features testnet` whenever the target
# daemon is a testnet build; mainnet builds omit it (constants agree at 0).
testnet = ["coincync/testnet"]

[dependencies]
# Reuse the parent crate's consensus types + hash function so we never
# drift from the validator. If the validator ever changes the recipe,
# the miner inherits the change automatically.
coincync = { path = "../..", default-features = false, features = ["randomx"] }

# Phase 1 — hasher correctness foundation
blake3 = "1.5"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
rand = "0.8"

# Phase 2 — Stratum client (TCP, JSON-RPC, async runtime)
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 4 — Daemon RPC client (HTTP-based JSON-RPC for solo mining).
# rustls so the bearer token flows over TLS when the operator points at
# api.coincync.network instead of a localhost daemon.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Block serialization — must use the SAME borsh version as the parent
# crate or the byte format won't match what the daemon validator
# decodes. Don't bump this without coordinating with the parent crate.
borsh = "1"

# Phase 4c — TOML config parsing (run-config subcommand)
toml = "0.8"

# Optional --tui dashboard for run-solo. Off the hot path: only renders
# when the operator asks for it; default still emits tracing logs to
# stdout so journalctl-driven systemd setups don't change.
ratatui   = "0.30"
crossterm = "0.29"
