[package]
name         = "coincync-frost-coordinator"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
description  = "FROST M-of-N signing coordinator — relays round-1 commitments and round-2 shares between participants without holding key material. Specified in CIP-008."
license      = "MIT"

# Library crate (the state machine). Phase 2+ adds a bin that wraps it
# in a WSS server.
[lib]
name = "coincync_frost_coordinator"
path = "src/lib.rs"

[features]
default = []

# Invitation-token authentication. Off by default so the core
# state-machine library remains zero-crypto. Production binaries
# (the eventual WSS server) enable this feature; phase 1 tests
# that exercise just the state machine don't need it.
invitations = ["dep:hmac", "dep:sha2", "dep:subtle"]

# JSON-file persistence for active sessions. Off by default so
# the core state-machine library has no I/O surface. Production
# binaries enable this feature so a coordinator can survive
# process restarts without losing in-flight sessions.
persistence = []

# WSS server binary (phase 4). Pulls in tokio + tokio-tungstenite
# + futures + tracing for the async networking layer. Off by
# default so library consumers don't pay the async runtime cost.
#
# Phase 6 added rate limiting (governor), idle-timeout, and a
# Prometheus metrics endpoint (axum + prometheus). All folded
# into the same `server` feature because the production server
# wants all three together.
server = [
    "invitations",
    "persistence",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:futures-util",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:governor",
    "dep:prometheus",
    "dep:axum",
    "dep:hyper",
]

# Operator CLI binary (phase 4.5). Sync; no async runtime.
cli = [
    "invitations",
    "persistence",
    "dep:clap",
    "dep:hex",
    "dep:getrandom",
]

[[bin]]
name = "coord"
path = "src/bin/coord.rs"
required-features = ["server"]

# Operator CLI: session creation, invitation minting, admin tasks
# (list / inspect / force-abort / gc-terminal). Sync — no tokio.
[[bin]]
name = "coord-cli"
path = "src/bin/coord_cli.rs"
required-features = ["cli"]

# Phase 5 integration test: full 2-of-3 signing flow + adversarial
# cases. Requires invitations + persistence to compile, since it
# exercises both layers in concert.
[[test]]
name = "integration_full_flow"
path = "tests/integration_full_flow.rs"
required-features = ["invitations", "persistence"]

[dependencies]
# Phase 1 is a pure state-machine library. It deliberately does NOT
# depend on the `coincync` crate — the coordinator never sees signing
# material, only opaque commitment / sig_share / aggregate-sig bytes,
# so it doesn't need FROST primitives. Phase 2+ adds a `wallet-codec`
# feature to depend on `coincync` for the wire-format round-trip.

# State + serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

# Errors
thiserror   = "1"

# UUID for session IDs (v7 = sortable timestamp + entropy)
uuid        = { version = "1", features = ["v7", "serde"] }

# Invitation tokens (phase 2, opt-in via `invitations` feature):
# HMAC-SHA256 over (session_id || participant_pubkey || expiry),
# keyed by a per-session secret minted by the creator. Constant-
# time comparison via `subtle` to avoid timing leaks.
hmac        = { version = "0.12", optional = true }
sha2        = { version = "0.10", optional = true }
subtle      = { version = "2",    optional = true }

# Server binary deps (phase 4, opt-in via `server` feature). The
# async runtime is gated so library consumers don't pay for it.
tokio              = { version = "1", features = ["full", "signal"], optional = true }
tokio-tungstenite  = { version = "0.21", optional = true }
futures-util       = { version = "0.3", optional = true }
tracing            = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# Phase 6 hardening deps. governor for per-IP attach rate
# limiting, prometheus for the /metrics endpoint, axum + hyper
# for the metrics HTTP server (a separate port from the WSS
# server so a metrics-scrape-flood can't DoS the protocol).
governor   = { version = "0.6", optional = true }
prometheus = { version = "0.14", optional = true }
axum       = { version = "0.7", optional = true }
hyper      = { version = "1", features = ["full"], optional = true }

# CLI binary deps (phase 4.5, opt-in via `cli` feature).
clap               = { version = "4", features = ["derive"], optional = true }
hex                = { version = "0.4", optional = true }

# CSPRNG for the `gen-secret` subcommand. CRITICAL: HMAC keys
# must be unguessable. The earlier fallback (LCG seeded from
# nanos+pid) was bug-bait; getrandom is portable across Linux
# (/dev/urandom), macOS (getentropy), Windows (BCryptGenRandom),
# and WASI.
getrandom          = { version = "0.2", optional = true }

[dev-dependencies]
# Property-based testing — generates thousands of inputs to verify
# state-machine invariants hold across arbitrary transition sequences.
# Catches edge cases unit tests miss; CIP-008 explicitly calls this out.
proptest    = "1"

# Filesystem fixtures for the persistence tests.
tempfile    = "3"
