[package]
name         = "coincync-top"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
authors      = ["CoinCync 1.0 Contributors"]
description  = "coincync-top — a native-Rust system + CoinCync node monitor (btop-style)."
license      = "MIT"
publish      = false

# A standalone terminal monitor: system metrics (CPU/mem/net/processes via
# `sysinfo`) PLUS live CoinCync node metrics (chain/mining/peers, polled from the
# node RPC). Pure client — depends on nothing in the coincync crate, so it builds
# and runs independently. btop-style boxed panels via ratatui/crossterm.

[[bin]]
name = "coincync-top"
path = "src/main.rs"

[dependencies]
ratatui    = "0.30"
crossterm  = "0.29"
sysinfo    = "0.32"
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
serde_json = "1"
clap       = { version = "4", features = ["derive", "env"] }
anyhow     = "1"
