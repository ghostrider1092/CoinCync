[package]
name         = "orchard-side"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
description  = "Isolated compile unit for the CoinCync Halo2/Orchard stack. Never pulled into the main coincync crate graph — see crates/bridge/ for why."
license      = "MIT"
publish      = false

[lib]
name = "orchard_side"
path = "src/lib.rs"

# This crate is the ONLY place `orchard` lives. It must not depend on
# anything from the Tari stack (tari_crypto, tari_bulletproofs_plus,
# curve25519-dalek, curve25519-dalek-ng) — the isolation boundary is
# the whole point.
[dependencies]
orchard    = "0.12"
rand       = "0.8"
thiserror  = "1"
zeroize    = { version = "1", features = ["derive"] }
bridge     = { path = "../bridge" }

[lints.rust]
unsafe_code  = "forbid"
missing_docs = "allow"

# Isolation marker: this crate must NOT be a member of the parent
# workspace (`/Cargo.toml`). The whole point of orchard-side is to
# keep `orchard` (and its `pasta_curves`/`halo2` transitive graph)
# off the main crate's build path so the tari↔orchard trait-solver
# conflict described at the top of `src/lib.rs` doesn't poison the
# default build. The empty `[workspace]` table below tells cargo
# this directory is its own workspace root.
[workspace]
