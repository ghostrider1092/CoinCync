[package]
name         = "coincync-rolling-finality"
version      = "0.1.0"
edition      = "2021"
rust-version = "1.75"
description  = "Miner-signed rolling-checkpoint soft-finality state machine — specified in CIP-009.D"
license      = "MIT"

# Library crate (the state machine). Phase 2+ adds:
#   - real ed25519 verification (currently behind a trait so the
#     consensus layer plugs it in)
#   - integration with `validate_block` for the reorg rule
#   - a `wallet-codec` feature for the on-wire attestation format
[lib]
name = "coincync_rolling_finality"
path = "src/lib.rs"

[features]
default = []

# Real ed25519 verification. Off by default so the core state-
# machine library remains zero-crypto. Production binaries
# (`coincync-node`) enable this feature; tests + property tests
# can run without it via `NoopVerifier`.
ed25519 = ["dep:ed25519-dalek"]

# Borsh-serializable wire codec for the coinbase-embedded
# attestation. Off by default so a downstream consumer that just
# wants the state machine doesn't pull in borsh. Phase 3
# (validate_block integration) will turn this on at the consensus
# boundary.
wire-codec = ["dep:borsh"]

[dependencies]
# Phase 1 was a pure state-machine library. Phase 2 adds two
# OPT-IN features that bring in cryptographic verification and
# the on-wire codec respectively. The state machine itself
# remains zero-crypto and zero-codec when no features are
# enabled.

# State + serialization
serde       = { version = "1", features = ["derive"] }

# Errors
thiserror   = "2"

# Real ed25519 — feature-gated. Used by `verifier_ed25519` module.
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }

# Borsh wire-format codec — feature-gated. Used by `codec` module.
borsh       = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
# Property-based testing — generates thousands of inputs to verify
# state-machine invariants hold across arbitrary attestation
# sequences. Same justification as the FROST coordinator phase 1
# crate.
proptest    = "1"

# Test-only access to ed25519 signing for round-trip tests of the
# verifier. We use rand_core 0.6 so we match `ed25519-dalek`'s
# constraint (it doesn't yet depend on rand 0.8's traits).
rand        = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
borsh       = { version = "1", features = ["derive"] }

# Phase 5 integration test: full composition with real ed25519
# signing + wire codec. Requires both features to compile.
[[test]]
name = "integration_full_flow"
path = "tests/integration_full_flow.rs"
required-features = ["ed25519", "wire-codec"]
