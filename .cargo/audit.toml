[advisories]
ignore = [
  # RA-2026-04-atomic-polyfill:
  # Transitive through frost-core -> postcard -> heapless.
  # Upstream chain still depends on atomic-polyfill as of frost-core 3.0.0.
  # Re-evaluate on every dependency refresh.
  "RUSTSEC-2023-0089",
  # RUSTSEC-2026-0253 (lru: panic-safety use-after-free in LruCache::pop):
  # An "unsound" WARNING, not a vulnerability. Dev/tooling only — transitive
  # via ratatui 0.30 -> ratatui-core -> lru 0.16 (the coincync-rig TUI
  # dashboard), NOT in the consensus/wallet/RPC runtime path. `lru` is pinned
  # to 0.16.x by ratatui-core, so it can't be bumped without a ratatui major
  # bump. Re-evaluate when ratatui updates its `lru` dependency.
  "RUSTSEC-2026-0253",
]

# Yanked-crate checks are intentionally disabled.
#
# Yanks are a quality/policy signal from crate maintainers, NOT a
# security vulnerability classification. The default `cargo audit`
# behavior treats yanks the same as RUSTSEC advisories (fail the
# build), which is too strict given how the Zcash / halo2 ecosystem
# uses yanks to nudge consumers toward newer minor releases.
#
# Background (added 2026-06-23): the entire `halo2_gadgets 0.3.x` series
# was yanked in favor of 0.5.0. CoinCync retains halo2 0.3 for the gated-off
# native v1 shielded path (the dead `orchard-side` crate that also pulled it
# was removed 2026-10-19 — CoinCync ships one shielded pool, Spark). Disable
# yank-failing so a transient upstream yank can't block consensus-relevant
# PRs from landing; RUSTSEC vulnerability checks stay strict.
#
# TODO: when the native v1 path is retired, drop the halo2 deps and flip
# enabled = true.
[yanked]
enabled = false
