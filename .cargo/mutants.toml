# cargo-mutants config for the audit-perimeter critical files.
#
# Mutation testing measures whether the test suite would *catch* an
# adversarial code change. cargo-mutants flips operators, constants,
# returns, and match arms one at a time; for each mutation it re-runs
# the test suite and reports MISSED (tests still pass — bad) vs
# CAUGHT (tests fail — good).
#
# Scope: load-bearing cryptographic / authentication files identified
# as audit-critical. Mutating CLI binaries, transport/coordinator, or
# state-machines doesn't tell us anything about CRYPTOGRAPHIC test
# quality, which is what the audit will scrutinize.
#
# Run:
#   cargo mutants                            # all files in examine_globs
#   cargo mutants -p coincync-swap           # cyncswap perimeter only
#   cargo mutants --file src/wallet/persistence.rs  # wallet v4 only
# Or use the overnight script for the full report:
#   bash scripts/mutants-overnight.sh

examine_globs = [
    # ─── cyncswap crypto perimeter (Priority 1-7 per cyncswap-audit-prep.md §5) ───
    "crates/coincync-swap/src/strict_dleq.rs",  # Priority 1 + 2: CDLP scalar-order, soundness
    "crates/coincync-swap/src/adaptor.rs",      # Priority 3 + 6: BTC adaptor + BIP-340 parity
    "crates/coincync-swap/src/cync.rs",         # Priority 4 + 5: joint-key derivation
    "crates/coincync-swap/src/btc.rs",          # Priority 7: BIP-341 script-path

    # ─── Wallet file v4 (added 2026-05-25 alongside v4 implementation) ───
    # Same critical-files discipline as the cyncswap files, per
    # docs/security/wallet-file-v4-design.md §6. The v4 surface =
    # HKDF-BLAKE3 key separation + BLAKE3-keyed HMAC verify-before-
    # AEAD + v3↔v4 framing dispatch + auto-upgrade-on-save. A mutation
    # that, say, flips the HMAC compare from constant-time ct_eq to a
    # length-checking != would pass v3 tests (v3 path untouched) but
    # break the v4 wrong-password property — the test suite SHOULD
    # catch that. cargo-mutants verifies that claim.
    "src/wallet/persistence.rs",
]

# Tests in these files exercise the strict-DLEQ path; without the
# feature flag, ~250 LOC of the audit perimeter is `#[cfg(...)]`-gated
# out and mutants there would falsely report as MISSED.
additional_cargo_test_args = ["--features", "strict-dleq"]

# A few patterns we deliberately don't mutate — they would generate
# noise without measuring real test coverage.
exclude_re = [
    # `Display` and `Debug` impls are formatting plumbing, not security
    # surface; mutating them generates noise but doesn't test anything
    # the audit cares about.
    "impl .* Display for",
    "impl .* Debug for",
]
